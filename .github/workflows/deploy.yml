name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏗️ Install and Build
        run: |
          npm ci
          npm run build
          mkdir -p deploy/public_html
          cp -r dist/* deploy/public_html/

      - name: 🔍 Report deploy size
        run: |
          du -sh deploy/public_html
          du -sh deploy/public_html/* | sort -rh | head -20

      - name: 🚀 Sync to cPanel via FTP
        timeout-minutes: 20
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: /
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
