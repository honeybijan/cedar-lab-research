name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏗️ Install and Build
        run: |
          npm ci
          npm run build
          mkdir -p deploy/public_html
          cp -r dist/* deploy/public_html/

      - name: 🚀 Sync to cPanel via SFTP
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            sftp://${{ secrets.FTP_SERVER }} \
            -e "set sftp:auto-confirm yes; set net:timeout 60; mirror -R deploy/ /; quit"
