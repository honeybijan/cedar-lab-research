name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏗️ Install and Build
        run: |
          npm ci
          npm run build
          mkdir -p deploy/public_html
          cp -r dist/* deploy/public_html/

      - name: 🔍 Report deploy size
        run: |
          du -sh deploy/public_html
          du -sh deploy/public_html/* | sort -rh | head -20

      # TEMPORARY DIAGNOSTIC STEP — delete once the connection issue is found.
      # Prints the runner's public IP, tests TCP reachability on port 22,
      # then dumps the full lftp/SSH protocol trace.
      - name: 🔍 Diagnose SFTP
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp netcat-openbsd
          echo "=== Runner public IP ==="
          curl -s https://api.ipify.org; echo
          echo "=== TCP reachability on port 22 ==="
          nc -zvw10 "${{ secrets.FTP_SERVER }}" 22 || echo "PORT 22 UNREACHABLE"
          echo "=== lftp protocol trace ==="
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            sftp://${{ secrets.FTP_SERVER }} <<'EOF'
          debug 5
          set sftp:auto-confirm yes
          set net:max-retries 1
          set net:timeout 15
          pwd
          ls
          bye
          EOF

      - name: 🚀 Sync to cPanel via SFTP
        timeout-minutes: 20
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            sftp://${{ secrets.FTP_SERVER }} <<'EOF'
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set xfer:timeout 120
          set mirror:parallel-transfer-count 3
          mirror -R --ignore-time --verbose \
            --no-perms --no-umask \
            --exclude '^Posters/' \
            deploy/public_html/ public_html/
          bye
          EOF
